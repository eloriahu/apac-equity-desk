# Project-local defaults. Authentication is completed interactively by the MCP client.
#
# enabled_tools is a hard allowlist enforced by Codex, not an instruction the
# model can ignore. It contains the tools that longbridge-mcp annotates
# read_only_hint = true (source checked at commit a791c4d, 2026-09-16), minus
# reads of the user's own account (balances, positions, orders, statements,
# bank cards, saved screener strategies, DCA/grid/alert/sharelist state). Every trading, alert, DCA, grid,
# watchlist, sharelist and community-post write tool is excluded.
#
# If Longbridge adds a tool, it stays blocked until reviewed and added here.
# "authenticate" is included only so a non-browser OAuth fallback still works.
[mcp_servers.longbridge]
url = "https://mcp.longbridge.com"
enabled = true
enabled_tools = [
  "authenticate",
  "now",
  "static_info",
  "quote",
  "option_quote",
  "warrant_quote",
  "depth",
  "brokers",
  "participants",
  "trades",
  "intraday",
  "candlesticks",
