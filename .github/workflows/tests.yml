name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile helpers
        run: python -m compileall -q plugins/apac-equity-desk/scripts
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

