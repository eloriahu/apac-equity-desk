[providers.bloomberg_user_upload]
enabled = true
role = "primary_market_input"
accepted = ["xlsx", "csv", "json", "screenshot"]

[providers.openbb]
enabled = false
role = "field_level_fallback"
preferred_provider = "fmp"
secondary_provider = "yfinance"
credentials = "local_provider_settings"

[providers.akshare]
enabled = false
role = "china_breadth_crosscheck"

[providers.tushare]
enabled = false
role = "china_fundamentals_flows"
token_env = "TUSHARE_TOKEN"

[providers.jin10]
enabled = false
role = "china_macro_flash_news"
url = "https://mcp.jin10.com"

[publication]
require_human_approval = true
draft_banner = "DRAFT — HUMAN APPROVAL REQUIRED"

[trading]
mode = "disabled"
